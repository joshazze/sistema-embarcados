<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Helvetica,Arial,sans-serif">
<rect width="1400" height="900" fill="#fff"/>
<text x="20" y="36" font-size="23" font-weight="bold">Gravar a ESP32-CAM usando o Mega como adaptador (Mega em RESET)</text>
<text x="20" y="70" font-size="15">1) Tudo desligado ao montar. PL2303 fora. Chave da fonte YwRobot desligada.</text>
<text x="20" y="94" font-size="15">2) Antes de ligar o fio laranja (coluna 43 -> U0R): plugar a USB do Mega e medir coluna 43 -> GND. 002 = ok; 001 = tirar os 3 primeiros resistores; 003+ = parar.</text>
<text x="20" y="118" font-size="15">3) Depois de gravar: tirar o jumper RESET-GND do Mega e o jumper IO0-GND da CAM.</text>
<rect x="30" y="190" width="270" height="400" rx="10" fill="#1d4f91"/>
