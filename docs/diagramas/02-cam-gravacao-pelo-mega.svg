<rect x="260" y="441" width="40" height="18" fill="#000"/><text x="252" y="455" font-size="14" fill="#fff" text-anchor="end">pino 1 (TX0)</text>
<text x="180" y="210" font-size="11" fill="#cfe" text-anchor="middle">(texto da placa pode estar trocado: siga o NUMERO)</text>
