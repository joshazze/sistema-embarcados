<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Helvetica,Arial,sans-serif">
<rect width="1100" height="720" fill="#fff"/>
<text x="20" y="36" font-size="23" font-weight="bold">Gravar a ESP32-CAM so pelo PL2303 (CAM fora da protoboard)</text>
<text x="20" y="70" font-size="15">1) CAM sem nenhum fio para a protoboard (nem 5V, nem GND). Fonte YwRobot nao alimenta a CAM agora.</text>
<text x="20" y="94" font-size="15">2) PL2303 fora da USB enquanto liga os fios. Depois pluga no Mac: a CAM liga em modo de gravacao.</text>
<text x="20" y="118" font-size="15">3) Depois de gravar: tirar o PL2303 da USB e tirar o jumper IO0-GND.</text>
<rect x="120" y="200" width="280" height="420" rx="10" fill="#1e2a4a"/>
<circle cx="260.0" cy="290" r="40" fill="#333" stroke="#888" stroke-width="3"/><circle cx="260.0" cy="290" r="15" fill="#123"/>
<text x="260.0" y="365" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">ESP32-CAM</text>
<text x="260.0" y="385" font-size="12" fill="#ccc" text-anchor="middle">(camera para cima)</text>
<circle cx="136" cy="415" r="6" fill="#ddd"/><text x="150" y="420" font-size="13" fill="#fff">5V</text>
<circle cx="384" cy="415" r="6" fill="#ddd"/><text x="370" y="420" font-size="13" fill="#fff" text-anchor="end">3V3</text>
<circle cx="136" cy="439" r="6" fill="#ddd"/><text x="150" y="444" font-size="13" fill="#fff">GND</text>
<circle cx="384" cy="439" r="6" fill="#ddd"/><text x="370" y="444" font-size="13" fill="#fff" text-anchor="end">IO16</text>
<circle cx="136" cy="463" r="6" fill="#ddd"/><text x="150" y="468" font-size="13" fill="#fff">IO12</text>
<circle cx="384" cy="463" r="6" fill="#ddd"/><text x="370" y="468" font-size="13" fill="#fff" text-anchor="end">IO0</text>
<circle cx="136" cy="487" r="6" fill="#ddd"/><text x="150" y="492" font-size="13" fill="#fff">IO13</text>
<circle cx="384" cy="487" r="6" fill="#ddd"/><text x="370" y="492" font-size="13" fill="#fff" text-anchor="end">GND</text>
<circle cx="136" cy="511" r="6" fill="#ddd"/><text x="150" y="516" font-size="13" fill="#fff">IO15</text>
<circle cx="384" cy="511" r="6" fill="#ddd"/><text x="370" y="516" font-size="13" fill="#fff" text-anchor="end">VCC</text>
<circle cx="136" cy="535" r="6" fill="#ddd"/><text x="150" y="540" font-size="13" fill="#fff">IO14</text>
<circle cx="384" cy="535" r="6" fill="#ddd"/><text x="370" y="540" font-size="13" fill="#fff" text-anchor="end">U0R</text>
<circle cx="136" cy="559" r="6" fill="#ddd"/><text x="150" y="564" font-size="13" fill="#fff">IO2</text>
<circle cx="384" cy="559" r="6" fill="#ddd"/><text x="370" y="564" font-size="13" fill="#fff" text-anchor="end">U0T</text>
<circle cx="136" cy="583" r="6" fill="#ddd"/><text x="150" y="588" font-size="13" fill="#fff">IO4</text>
<circle cx="384" cy="583" r="6" fill="#ddd"/><text x="370" y="588" font-size="13" fill="#fff" text-anchor="end">GND</text>
<path d="M 384 463 C 424 463, 424 487, 384 487" fill="none" stroke="#7a3fd0" stroke-width="5"/>
<circle cx="384" cy="463" r="6" fill="#7a3fd0" stroke="#fff" stroke-width="1.5"/>
<circle cx="384" cy="487" r="6" fill="#7a3fd0" stroke="#fff" stroke-width="1.5"/>
<text x="434" y="479" font-size="13" fill="#7a3fd0" font-weight="bold">jumper IO0-GND (so para gravar)</text>
<rect x="760" y="300" width="210" height="200" rx="8" fill="#b01e2a"/>
<text x="865" y="328" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">adaptador PL2303</text>
<rect x="970" y="380" width="70" height="40" fill="#bbb"/><text x="1005" y="405" font-size="12" text-anchor="middle">USB Mac</text>
<circle cx="776" cy="355" r="6" fill="#ddd"/><text x="790" y="360" font-size="14" fill="#fff">3V3</text>
<circle cx="776" cy="385" r="6" fill="#ddd"/><text x="790" y="390" font-size="14" fill="#fff">TXD</text>
<circle cx="776" cy="415" r="6" fill="#ddd"/><text x="790" y="420" font-size="14" fill="#fff">RXD</text>
<circle cx="776" cy="445" r="6" fill="#ddd"/><text x="790" y="450" font-size="14" fill="#fff">GND</text>
<circle cx="776" cy="475" r="6" fill="#ddd"/><text x="790" y="480" font-size="14" fill="#fff">5V</text>
<text x="840" y="360" font-size="12" fill="#ffd">solto</text>
<path d="M 776 475 L 700 475 L 700 650 L 60 650 L 60 415 L 136 415" fill="none" stroke="#d81e1e" stroke-width="5" stroke-linecap="round"/>
<circle cx="776" cy="475" r="6" fill="#d81e1e" stroke="#fff" stroke-width="1.5"/>
<circle cx="136" cy="415" r="6" fill="#d81e1e" stroke="#fff" stroke-width="1.5"/>
<path d="M 776 445 L 720 445 L 720 670 L 85 670 L 85 439 L 136 439" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
<circle cx="776" cy="445" r="6" fill="#111" stroke="#fff" stroke-width="1.5"/>
<circle cx="136" cy="439" r="6" fill="#111" stroke="#fff" stroke-width="1.5"/>
<path d="M 384 535 C 560 535, 620 385, 776 385" fill="none" stroke="#2a9d3a" stroke-width="5" stroke-linecap="round"/>
<circle cx="384" cy="535" r="6" fill="#2a9d3a" stroke="#fff" stroke-width="1.5"/>
<circle cx="776" cy="385" r="6" fill="#2a9d3a" stroke="#fff" stroke-width="1.5"/>
<path d="M 384 559 C 580 559, 640 415, 776 415" fill="none" stroke="#e0b000" stroke-width="5" stroke-linecap="round"/>
<circle cx="384" cy="559" r="6" fill="#e0b000" stroke="#fff" stroke-width="1.5"/>
<circle cx="776" cy="415" r="6" fill="#e0b000" stroke="#fff" stroke-width="1.5"/>
<text x="560" y="373" font-size="13" fill="#2a9d3a" font-weight="bold">U0R -> TXD</text>
<text x="600" y="589" font-size="13" fill="#a07a00" font-weight="bold">U0T -> RXD</text>
<text x="430" y="640" font-size="13" fill="#d81e1e" font-weight="bold">5V do PL2303 -> 5V da CAM</text>
<text x="430" y="700" font-size="13" fill="#111" font-weight="bold">GND do PL2303 -> GND da CAM (esquerda)</text>
</svg>