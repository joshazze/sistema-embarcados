<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#f7f7f4"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="bold">Diodo 1N4007 na fechadura</text>
  <text x="600" y="85" text-anchor="middle" font-size="18" fill="#555">Monte com os 12 V DESLIGADOS. O diodo fica em paralelo com a fechadura, nos dois terminais dela.</text>

  <!-- Fonte 12V -->
  <rect x="60" y="160" width="230" height="200" rx="14" fill="#333" stroke="#000" stroke-width="3"/>
  <text x="175" y="215" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">FONTE 12 V</text>
  <circle cx="125" cy="300" r="20" fill="#e53935"/><text x="125" y="308" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">+</text>
  <circle cx="225" cy="300" r="20" fill="#111" stroke="#aaa" stroke-width="2"/><text x="225" y="307" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">-</text>

  <!-- Rele -->
  <rect x="470" y="140" width="260" height="240" rx="14" fill="#1565c0" stroke="#0d3c7a" stroke-width="3"/>
  <text x="600" y="185" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">MÓDULO RELÉ</text>
  <text x="600" y="210" text-anchor="middle" font-size="14" fill="#cfe3ff">(lado de potência, bornes azuis)</text>
  <rect x="510" y="300" width="50" height="50" fill="#2e7d32" stroke="#000"/><text x="535" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">C</text>
  <rect x="575" y="300" width="50" height="50" fill="#2e7d32" stroke="#000"/><text x="600" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">NA</text>
  <rect x="640" y="300" width="50" height="50" fill="#777" stroke="#000"/><text x="665" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">NF</text>
  <text x="665" y="290" text-anchor="middle" font-size="12" fill="#cfe3ff">sem fio</text>

  <!-- Fechadura -->
  <rect x="850" y="560" width="280" height="300" rx="16" fill="#9e9e9e" stroke="#555" stroke-width="3"/>
  <text x="990" y="610" text-anchor="middle" font-size="26" font-weight="bold">FECHADURA</text>
  <text x="990" y="640" text-anchor="middle" font-size="16" fill="#333">(bobina 12 V)</text>
  <rect x="900" y="680" width="70" height="40" rx="6" fill="#e53935" stroke="#000"/><text x="935" y="707" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">+</text>
  <rect x="1010" y="680" width="70" height="40" rx="6" fill="#111" stroke="#000"/><text x="1045" y="707" text-anchor="middle" font-size="26" font-weight="bold" fill="#fff">-</text>
  <text x="935" y="745" text-anchor="middle" font-size="14">fio do NA</text>
  <text x="1045" y="745" text-anchor="middle" font-size="14">fio do GND</text>

  <!-- Fios -->
  <!-- +12 -> C -->
  <polyline points="125,320 125,440 535,440 535,350" fill="none" stroke="#e53935" stroke-width="8"/>
  <text x="300" y="430" text-anchor="middle" font-size="16" fill="#e53935">+12 V para o C</text>
  <!-- NA -> lock + -->
  <polyline points="600,350 600,520 935,520 935,680" fill="none" stroke="#e53935" stroke-width="8"/>
  <text x="770" y="510" text-anchor="middle" font-size="16" fill="#e53935">NA para o + da fechadura</text>
  <!-- lock - -> fonte - -->
  <polyline points="1045,720 1045,960 225,960 225,320" fill="none" stroke="#111" stroke-width="8"/>
  <text x="640" y="990" text-anchor="middle" font-size="16">− da fechadura direto no − da fonte 12 V (não pela protoboard)</text>

  <!-- Diodo entre + e - da fechadura -->
  <polyline points="935,720 935,800 870,800 870,870" fill="none" stroke="#e53935" stroke-width="5"/>
  <polyline points="1045,720 1045,800 1100,800 1100,960" fill="none" stroke="#111" stroke-width="5"/>
  <!-- diode body drawn horizontally below the lock -->
  <line x1="870" y1="870" x2="870" y2="900" stroke="#888" stroke-width="5"/>
  <rect x="870" y="880" width="0" height="0"/>
  <g>
    <line x1="870" y1="900" x2="930" y2="900" stroke="#888" stroke-width="5"/>
    <rect x="930" y="880" width="130" height="40" rx="12" fill="#222"/>
    <rect x="938" y="880" width="18" height="40" fill="#cfcfcf"/>
    <line x1="1060" y1="900" x2="1100" y2="900" stroke="#888" stroke-width="5"/>
  </g>
  <text x="995" y="905" text-anchor="middle" font-size="14" fill="#fff">1N4007</text>
  <text x="947" y="870" text-anchor="middle" font-size="15" font-weight="bold" fill="#d32f2f">FAIXA</text>
  <text x="890" y="945" text-anchor="middle" font-size="14" fill="#d32f2f">faixa no +</text>
  <text x="1090" y="945" text-anchor="middle" font-size="14">outro lado no −</text>

  <!-- Box explicacao -->
  <rect x="60" y="560" width="740" height="330" rx="12" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <text x="80" y="600" font-size="22" font-weight="bold">Passo a passo</text>
  <g font-size="18">
    <text x="80" y="640">1. Desligue os 12 V (tire a fonte da tomada).</text>
    <text x="80" y="675">2. Ache a FAIXA cinza no corpo preto do 1N4007.</text>
    <text x="80" y="710">3. Lado da FAIXA: no terminal + da fechadura</text>
    <text x="104" y="735">(o mesmo onde chega o fio do NA do relé).</text>
    <text x="80" y="770">4. Outro lado: no terminal − da fechadura</text>
    <text x="104" y="795">(o mesmo onde sai o fio para o − da fonte).</text>
    <text x="80" y="830">5. Prenda bem (solda ou borne), perto da fechadura.</text>
    <text x="80" y="865">6. Confira o sentido DUAS vezes antes de religar os 12 V.</text>
  </g>

  <rect x="60" y="1030" width="1080" height="140" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="80" y="1068" font-size="20" font-weight="bold" fill="#e65100">Atenção</text>
  <text x="80" y="1100" font-size="17" fill="#333">Invertido (faixa no −), o diodo vira um CURTO nos 12 V toda vez que o relé fecha: o diodo queima e a fonte pode desarmar.</text>
  <text x="80" y="1130" font-size="17" fill="#333">Certo (faixa no +), ele fica parado enquanto a fechadura está ligada e só conduz o pico na hora em que ela solta.</text>
  <text x="80" y="1158" font-size="17" fill="#333">É esse pico, hoje sem caminho, que reinicia o Mega.</text>
</svg>
