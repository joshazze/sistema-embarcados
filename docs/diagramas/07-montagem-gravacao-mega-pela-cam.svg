<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1300" viewBox="0 0 1300 1300" font-family="Helvetica, Arial, sans-serif">
  <rect width="1300" height="1300" fill="#f7f7f4"/>
  <text x="650" y="40" text-anchor="middle" font-size="26" font-weight="bold">Montagem: Mega 1 + ESP32-CAM (link atual + gravação pela CAM)</text>
  <text x="650" y="68" text-anchor="middle" font-size="16" fill="#555">Proposta, ainda não montada. Fios verdes = já existem. Fios laranja/roxo/azul = novos. Preto = GND.</text>

  <!-- ===== MEGA (left) ===== -->
  <rect x="40" y="110" width="330" height="560" rx="14" fill="#1f6f9f" stroke="#0d3d5c" stroke-width="3"/>
  <text x="205" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">ARDUINO MEGA 1</text>
  <rect x="85" y="175" width="70" height="45" rx="4" fill="#c0c0c0" stroke="#666"/>
  <text x="120" y="203" text-anchor="middle" font-size="13">USB</text>

  <!-- Communication header -->
  <text x="205" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">barra COMMUNICATION</text>
  <g font-size="15" fill="#fff">
    <rect x="300" y="280" width="26" height="26" fill="#222"/><text x="290" y="299" text-anchor="end">D1  TX0</text>
    <rect x="300" y="315" width="26" height="26" fill="#222"/><text x="290" y="334" text-anchor="end">D0  RX0</text>
    <rect x="300" y="350" width="26" height="26" fill="#222"/><text x="290" y="369" text-anchor="end">D16 TX2</text>
    <rect x="300" y="385" width="26" height="26" fill="#222"/><text x="290" y="404" text-anchor="end">D17 RX2</text>
  </g>
  <!-- Power header -->
  <text x="205" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">barra POWER</text>
  <g font-size="15" fill="#fff">
    <rect x="300" y="490" width="26" height="26" fill="#222"/><text x="290" y="509" text-anchor="end">RESET</text>
    <rect x="300" y="525" width="26" height="26" fill="#222"/><text x="290" y="544" text-anchor="end">GND</text>
  </g>
  <text x="205" y="620" text-anchor="middle" font-size="13" fill="#d8ecf7">Mega alimentado pela USB do Mac</text>

  <!-- ===== CAM (right) ===== -->
  <rect x="950" y="110" width="310" height="560" rx="14" fill="#2b2b2b" stroke="#000" stroke-width="3"/>
  <text x="1105" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">ESP32-CAM</text>
  <circle cx="1105" cy="210" r="34" fill="#111" stroke="#888" stroke-width="3"/>
  <text x="1105" y="268" text-anchor="middle" font-size="12" fill="#bbb">câmera</text>
  <text x="1105" y="292" text-anchor="middle" font-size="13" fill="#ffb347">só 3,3 V nos pinos IO</text>
  <g font-size="15" fill="#fff">
    <rect x="975" y="315" width="26" height="26" fill="#d4af37"/><text x="1011" y="334">5V</text>
    <rect x="975" y="350" width="26" height="26" fill="#d4af37"/><text x="1011" y="369">GND</text>
    <rect x="975" y="385" width="26" height="26" fill="#d4af37"/><text x="1011" y="404">IO12</text>
    <rect x="975" y="420" width="26" height="26" fill="#d4af37"/><text x="1011" y="439">IO13</text>
    <rect x="975" y="455" width="26" height="26" fill="#d4af37"/><text x="1011" y="474">IO15</text>
    <rect x="975" y="490" width="26" height="26" fill="#d4af37"/><text x="1011" y="509">IO14</text>
    <rect x="975" y="525" width="26" height="26" fill="#d4af37"/><text x="1011" y="544">IO2</text>
    <rect x="975" y="560" width="26" height="26" fill="#d4af37"/><text x="1011" y="579">IO4 (não usar)</text>
  </g>
  <text x="1105" y="630" text-anchor="middle" font-size="13" fill="#bbb">fileira de pinos do lado do 5V</text>
  <text x="1105" y="650" text-anchor="middle" font-size="13" fill="#bbb">(confira nomes impressos na placa)</text>

  <!-- ===== Breadboard (middle) ===== -->
  <rect x="420" y="110" width="480" height="760" rx="10" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <text x="660" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">protoboard</text>
  <!-- GND rail -->
  <rect x="440" y="820" width="440" height="22" fill="#e6e6ff" stroke="#3b3bb3"/>
  <text x="660" y="836" text-anchor="middle" font-size="13" fill="#3b3bb3">trilha GND (-)</text>

  <!-- Block A: existing divisor D16 -> IO13 -->
  <text x="660" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">A. Divisor do link (já montado)</text>
  <rect x="520" y="195" width="80" height="22" rx="10" fill="#e8d3a8" stroke="#8a6d3b"/><text x="560" y="211" text-anchor="middle" font-size="12">1 kΩ</text>
  <circle cx="640" cy="206" r="7" fill="#2e7d32"/><text x="652" y="200" font-size="12" fill="#2e7d32">meio</text>
  <rect x="660" y="225" width="22" height="70" rx="10" fill="#e8d3a8" stroke="#8a6d3b"/><text x="692" y="265" font-size="12">2 x 1 kΩ</text>
  <!-- Block B: new divisor D1 -> IO15 -->
  <text x="660" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#d35400">B. Divisor NOVO (D1 para IO15)</text>
  <rect x="520" y="360" width="80" height="22" rx="10" fill="#e8d3a8" stroke="#8a6d3b"/><text x="560" y="376" text-anchor="middle" font-size="12">1 kΩ</text>
  <circle cx="640" cy="371" r="7" fill="#d35400"/><text x="652" y="365" font-size="12" fill="#d35400">meio (medir 3,3 V)</text>
  <rect x="660" y="390" width="22" height="70" rx="10" fill="#e8d3a8" stroke="#8a6d3b"/><text x="692" y="430" font-size="12">2 x 1 kΩ</text>
  <!-- Block C: transistor -->
  <text x="660" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#7b3fa0">C. Transistor do RESET (BC337)</text>
  <path d="M600,600 A35,35 0 0,1 670,600 L670,612 L600,612 Z" fill="#333"/>
  <text x="635" y="595" text-anchor="middle" font-size="11" fill="#fff">BC337</text>
  <text x="635" y="580" text-anchor="middle" font-size="10" fill="#ccc">face plana p/ frente</text>
  <line x1="610" y1="612" x2="610" y2="650" stroke="#777" stroke-width="4"/>
  <line x1="635" y1="612" x2="635" y2="650" stroke="#777" stroke-width="4"/>
  <line x1="660" y1="612" x2="660" y2="650" stroke="#777" stroke-width="4"/>
  <text x="610" y="668" text-anchor="middle" font-size="14" font-weight="bold">C</text>
  <text x="635" y="668" text-anchor="middle" font-size="14" font-weight="bold">B</text>
  <text x="660" y="668" text-anchor="middle" font-size="14" font-weight="bold">E</text>
  <rect x="700" y="690" width="80" height="22" rx="10" fill="#e8d3a8" stroke="#8a6d3b"/><text x="740" y="706" text-anchor="middle" font-size="12">1 kΩ (base)</text>
  <rect x="790" y="725" width="22" height="70" rx="10" fill="#e8d3a8" stroke="#8a6d3b"/><text x="822" y="765" font-size="12">10 kΩ</text>

  <!-- ===== WIRES ===== -->
  <!-- A: D16 -> 1k ; mid -> IO13 ; 2x1k -> GND ; IO14 -> D17 -->
  <polyline points="326,363 470,363 470,206 520,206" fill="none" stroke="#2e7d32" stroke-width="5"/>
  <polyline points="600,206 640,206 671,206 671,225" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <polyline points="640,206 920,206 920,433 975,433" fill="none" stroke="#2e7d32" stroke-width="5"/>
  <polyline points="671,295 671,310 870,310 870,820" fill="none" stroke="#000" stroke-width="3"/>
  <polyline points="975,503 930,503 930,398 340,398 326,398" fill="none" stroke="#66bb6a" stroke-width="5"/>
  <text x="560" y="392" font-size="12" fill="#2e7d32">IO14 -&gt; D17 direto</text>

  <!-- B: D1 -> 1k ; mid -> IO15 ; 2x1k -> GND -->
  <polyline points="326,293 450,293 450,371 520,371" fill="none" stroke="#d35400" stroke-width="5"/>
  <polyline points="600,371 671,371 671,390" fill="none" stroke="#d35400" stroke-width="3"/>
  <polyline points="640,371 905,371 905,468 975,468" fill="none" stroke="#d35400" stroke-width="5" stroke-dasharray="14,6"/>
  <text x="770" y="363" font-size="12" fill="#d35400">só ligar no IO15 depois de medir</text>
  <polyline points="671,460 671,475 855,475 855,820" fill="none" stroke="#000" stroke-width="3"/>

  <!-- IO2 -> D0 -->
  <polyline points="975,538 940,538 940,488 430,488 430,328 326,328" fill="none" stroke="#1e88e5" stroke-width="5"/>
  <text x="560" y="482" font-size="12" fill="#1e88e5">IO2 -&gt; D0 DIRETO (risco aceito)</text>

  <!-- C: RESET -> collector ; IO12 -> 1k -> base ; 10k base side to GND ; emitter -> GND -->
  <polyline points="326,503 560,503 560,690 610,690 610,650" fill="none" stroke="#7b3fa0" stroke-width="5"/>
  <text x="440" y="520" font-size="12" fill="#7b3fa0">RESET -&gt; coletor</text>
  <polyline points="975,398 960,398 960,701 780,701" fill="none" stroke="#7b3fa0" stroke-width="5"/>
  <polyline points="700,701 635,701 635,650" fill="none" stroke="#7b3fa0" stroke-width="3"/>
  <polyline points="801,701 801,725" fill="none" stroke="#7b3fa0" stroke-width="3"/>
  <polyline points="801,795 801,820" fill="none" stroke="#000" stroke-width="3"/>
  <polyline points="660,650 660,820" fill="none" stroke="#000" stroke-width="3"/>
  <text x="845" y="690" font-size="11" fill="#7b3fa0">10 kΩ do lado</text>
  <text x="845" y="703" font-size="11" fill="#7b3fa0">do IO12 ao GND</text>

  <!-- GND links -->
  <polyline points="326,538 400,538 400,831 440,831" fill="none" stroke="#000" stroke-width="4"/>
  <polyline points="975,363 950,363 950,880 880,880 880,842" fill="none" stroke="#000" stroke-width="4"/>
  <!-- CAM power -->
  <polyline points="975,328 945,328 945,95 1180,95" fill="none" stroke="#e53935" stroke-width="4"/>
  <text x="1185" y="99" font-size="12" fill="#e53935">5 V da fonte</text>
  <text x="1185" y="113" font-size="12" fill="#e53935">(YwRobot)</text>

  <!-- ===== Legend / checklist ===== -->
  <rect x="40" y="900" width="1220" height="370" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="60" y="935" font-size="19" font-weight="bold">Ligações (de -&gt; para)</text>
  <g font-size="16">
    <text x="60" y="968" fill="#2e7d32">A (já existe): D16 -&gt; 1 kΩ -&gt; meio -&gt; IO13;  meio -&gt; 2 x 1 kΩ -&gt; GND;  IO14 -&gt; D17 direto</text>
    <text x="60" y="1000" fill="#d35400">B (novo): D1 -&gt; 1 kΩ -&gt; meio -&gt; IO15;  meio -&gt; 2 x 1 kΩ -&gt; GND.  Medir ~3,3 V no meio ANTES de ligar o IO15.</text>
    <text x="60" y="1032" fill="#1e88e5">Novo: IO2 da CAM -&gt; D0 do Mega DIRETO (montagem real, risco aceito pelo dono: o chip USB do Mega põe 5 V por 1 kΩ no IO2; um diodo 1N4148 com a faixa no IO2 eliminaria isso).</text>
    <text x="60" y="1064" fill="#7b3fa0">C (novo): IO12 -&gt; 1 kΩ -&gt; base (B) do BC337;  10 kΩ do lado do IO12 até o GND;  coletor (C) -&gt; RESET;  emissor (E) -&gt; GND</text>
    <text x="60" y="1096" fill="#000">GND comum: GND do Mega, GND da CAM, GND da fonte, emissor, 10 kΩ e os dois divisores na mesma trilha</text>
  </g>
  <text x="60" y="1140" font-size="19" font-weight="bold">Cuidados</text>
  <g font-size="16" fill="#333">
    <text x="60" y="1172">1. Nunca 5 V em pino IO da CAM: D1 só chega na CAM pelo divisor B.</text>
    <text x="60" y="1204">2. BC337: face plana para você, pernas para baixo = C, B, E (esquerda para a direita).</text>
    <text x="60" y="1236">3. O 10 kΩ mantém o IO12 baixo quando a CAM liga (senão ela não inicia). Monte tudo com a USB e a fonte desligadas.</text>
  </g>
</svg>
